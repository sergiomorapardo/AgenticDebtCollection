[project]
name = "cobranza-agent-lab"
version = "0.1.0"
description = "Laboratorio de cobranza para Colombia con LangGraph y simulación de voz"
requires-python = ">=3.12,<3.14"
dependencies = [
  "holidays>=0.80,<1",
  "langchain-anthropic>=1.7.2,<2",
  "langgraph>=1.2.11,<2",
  "pydantic>=2.13.5,<3",
  "python-dotenv>=1.2.3,<2",
]

[project.scripts]
collections-lab = "agents.collections.__main__:main"

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.4.31,<0.5",
  "langgraph-api>=0.15.1,<0.16",
  "pytest>=8,<10",
  "ruff>=0.16.10,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/collections_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
