[project]
name = "agentic-debt-collection"
version = "0.1.0"
description = "A conversational debt collection agent that negotiates payment plans and tracks payment commitments"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "holidays>=0.80,<1",
  "jinja2>=3.1.6,<4",
  "langchain-anthropic>=1.7.2,<2",
  "langgraph>=1.2.11,<2",
  "pydantic>=2.13.5,<3",
  "python-dotenv>=1.2.3,<2",
]

[project.scripts]
collections-lab = "agents.collections.__main__:main"
collections-voice = "collections_lab.channels.voice_app:main"

[project.optional-dependencies]
voice = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.4.31,<0.5",
  "langgraph-api>=0.15.1,<0.16",
  "pytest>=8,<10",
  "ruff>=0.16.10,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/collections_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
