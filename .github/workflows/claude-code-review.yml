name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            Read AGENTS.md and inspect the diff and relevant tests. Check correctness,
            regressions, data privacy, and repository instructions. Cite concrete file
            locations for actionable findings; avoid speculative or stylistic comments.
            Post inline comments for confirmed findings and a completed summary comment,
            including an explicit statement when no actionable issues are found.
            Review only: do not edit files, push changes, merge, or trigger other workflows.
            Use only Opus. Do not delegate or switch models.
            Use file tools and the allowed read-only Git/GitHub commands.
            Do not run repository code, install dependencies, or retry denied tools.
            Report validation you could not perform. Reserve the final five turns
            to publish findings and the completed summary, even when none are found.
          claude_args: >-
            --model opus
            --max-turns 40
            --disallowedTools "Agent,Task,Skill,Edit,Write"
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      - name: Report Claude provider failure safely
        if: failure() && steps.claude-review.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ.get('EXECUTION_FILE') or (
              Path(os.environ['RUNNER_TEMP_DIR']) / 'claude-execution-output.json'
          ))
          if not path.is_file():
              print('Claude diagnostic: execution result unavailable.')
              raise SystemExit(0)
          data = json.loads(path.read_text())
          messages = data if isinstance(data, list) else [data]
          results = [item for item in messages if isinstance(item, dict) and item.get('type') == 'result']
          if not results:
              print('Claude diagnostic: no result message available.')
              raise SystemExit(0)
          result = results[-1]
          status = result.get('api_error_status')
          status = status if type(status) is int and 100 <= status <= 599 else None
          text = str(result.get('result', '')).lower()
          if status == 429 or 'hit your' in text and 'limit' in text:
              reason = 'provider usage or rate limit; check account reset time'
          elif status == 401 or 'oauth' in text and ('expired' in text or 'invalid' in text):
              reason = 'provider authentication rejected; renew the authorized credential'
          elif status in (403, 404) or 'selected model' in text:
              reason = 'provider model or access unavailable; verify configured model and account access'
          else:
              reason = 'unclassified provider failure; no raw model output is logged'
          print(f'Claude diagnostic: HTTP={status or "unavailable"}; {reason}.')
          PY
