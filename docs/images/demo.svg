<g class="turn t0"><text x="24" y="64" class="user">Tú: Hola</text><text x="24" y="84" class="agent">Agente: Hola, soy el asistente virtual de atención de cartera. Para</text><text x="24" y="104" class="agent">  consultar tu cuenta, ¿me compartes tu número de identificación?</text><text x="24" y="124" class="nodes">  ↳ human_input → understand_message → route_chat_message → identify_customer → assistant_message</text><text x="24" y="144" class="nodes">    [awaiting_customer]</text></g><g class="turn t1"><text x="24" y="178" class="user">Tú: Mi cédula es 1000000001</text><text x="24" y="198" class="agent">Agente: Antes de consultar tu cuenta, ¿me compartes el código de</text><text x="24" y="218" class="agent">  verificación?</text><text x="24" y="238" class="nodes">  ↳ human_input → understand_message → route_chat_message → identify_customer → assistant_message</text><text x="24" y="258" class="nodes">    [awaiting_identity]</text></g><g class="turn t2"><text x="24" y="292" class="user">Tú: 1111</text><text x="24" y="312" class="agent">Agente: Gracias, verifiqué tu identidad. El saldo registrado es 600,000</text><text x="24" y="332" class="agent">  COP. ¿Prefieres pagar el total o explorar un plan de dos o tres cuotas?</text><text x="24" y="352" class="nodes">  ↳ human_input → understand_message → route_chat_message → verify_identity → recover_history → intake →</text><text x="24" y="372" class="nodes">    prepare_reply → response → assistant_message  [ready]</text></g><g class="turn t3"><text x="24" y="406" class="user">Tú: quiero 3 cuotas desde 2026-10-20</text><text x="24" y="426" class="agent">Agente: Propuesta: 200,000 COP el 2026-10-20; 200,000 COP el 2026-11-20;</text><text x="24" y="446" class="agent">  200,000 COP el 2026-12-20. Total: 600,000 COP, sin descuentos ni cargos</text><text x="24" y="466" class="agent">  adicionales. ¿Confirmas este importe y estas fechas? Responde confirmo o</text><text x="24" y="486" class="agent">  propone cambios.</text><text x="24" y="506" class="nodes">  ↳ human_input → understand_message → route_chat_message → intake → interpret → dialogue_strategy → negotiation</text><text x="24" y="526" class="nodes">    → prepare_reply → response → assistant_message  [awaiting_confirmation]</text></g><g class="turn t4"><text x="24" y="560" class="user">Tú: confirmo</text><text x="24" y="580" class="agent">Agente: Registré tu compromiso con referencia agreement-…. Esto es una</text><text x="24" y="600" class="agent">  promesa de pago: el saldo continúa pendiente hasta verificar un pago.</text><text x="24" y="620" class="agent">  Gracias.</text><text x="24" y="640" class="nodes">  ↳ human_input → understand_message → route_chat_message → intake → interpret → dialogue_strategy →</text><text x="24" y="660" class="nodes">    confirmation → commitment → prepare_reply → response → assistant_message  [agreed]</text></g>
